x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    _PIP_ADDITIONAL_REQUIREMENTS: "psycopg2-binary==2.9.9"
    PIPELINE_DB_HOST: postgres-app
    PIPELINE_DB_NAME: fleet
    PIPELINE_DB_USER: fleet
    PIPELINE_DB_PASSWORD: fleet
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres-airflow:
      condition: service_healthy

services:
  # ---------- Messaging ----------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      # Pure-bash TCP check: works without nc/cub and without 4-letter-word whitelisting
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/2181' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    restart: on-failure
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trip_events --partitions 3 --replication-factor 1"

  # ---------- App storage (speed + batch layer outputs) ----------
  postgres-app:
    image: postgres:16
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-app-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Airflow's own metadata DB (separate from app data) ----------
  postgres-airflow:
    image: postgres:16
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: ["/bin/bash", "-c"]
    # "|| true" on user creation so re-runs (user already exists) still count as success
    command: >
      "airflow db migrate &&
       (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true)"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: on-failure
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------- Speed layer ----------
  spark-streaming-job:
    build: ./streaming
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      postgres-app:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PIPELINE_DB_HOST: postgres-app
      PIPELINE_DB_NAME: fleet
      PIPELINE_DB_USER: fleet
      PIPELINE_DB_PASSWORD: fleet
      SIMULATED_DAY_SECONDS: "300"

  # ---------- Simulated data sources ----------
  streaming-source-sim:
    build: ./producers
    command: ["python", "streaming_source.py"]
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  batch-source-sim:
    build: ./producers
    command: ["python", "batch_source.py"]
    restart: on-failure
    volumes:
      - ./airflow/data:/data
    environment:
      SIMULATED_DAY_SECONDS: "300"

  # ---------- Serving layer ----------
  serving-api:
    build: ./serving
    restart: on-failure
    ports:
      - "8000:8000"
    depends_on:
      postgres-app:
        condition: service_healthy
    environment:
      PIPELINE_DB_HOST: postgres-app
      PIPELINE_DB_NAME: fleet
      PIPELINE_DB_USER: fleet
      PIPELINE_DB_PASSWORD: fleet

volumes:
  postgres-app-data:
  postgres-airflow-data:
  airflow-logs: